<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f3f7fa">
  <title>Crispr Learning</title>
  <link rel="icon" href="https://crisprlearning.com/wp-content/uploads/2025/01/favicon.png" sizes="192x192" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />

  <!-- Controller -->
  <script src="../assets/js/jquery.js"></script>
  <script src="../assets/js/player.min.js"></script>
  <script src="course.js"></script>
</head>

<body>

<div id="errorOverlay" class="error-overlay" style="display: none;">
  <div class="error-content">
    <h2>Sorry, something is not right here.</h2>
    <a href="https://candidate.crisprlearning.com" target="">Go Back to Candidate Portal</a>
  </div>
</div>

  <!-- Mobile Toggle Button -->
  <button class="toggle-sidebar" id="toggleButton" onclick="toggleSidebar()" aria-label="Toggle chapter list">☰</button>
  <div id="toaster" class="toaster"></div>

  <div class="container">

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
      <a class="sidebar-brand" href="../dashboard.html"><img src="../assets/logo/crispr-logo.svg" alt="Crispr Learning"></a>
      <h3 id="sidebarHeader"></h3>
      <h2 id="sidebarTitle"></h2>
      <!-- <div class="rating"> ★ ★ ★ ★ ★ <span>9.9 / 10 (2 reviews)</span> </div> -->
      <div class="mentor" id="mentorTile"></div>
      <ul class="chapter-list" id="partsList"></ul>
    </div>

    <!-- Content Area -->
    <div class="content">
      <h3 id="contentTitle"></h3>
      <p class="subtext" id="contentTitleSub"></p>

      <div class="video-wrapper" id="videoRenderSpace">
      </div>

    </div>

  </div>

  <script type="text/javascript">
    function toggleSidebar() {
      var toggleElement = document.getElementById('sidebar');
      toggleElement.classList.toggle('open');
      if(!toggleElement.classList.contains("open")) {
        document.getElementById("toggleButton").innerText = "☰";
      } else {
        document.getElementById("toggleButton").innerText = "X";
      }
    }
  </script>

</body>
</html>
